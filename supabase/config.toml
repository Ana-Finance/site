# Configuration Supabase CLI (supabase link / db push / functions deploy).
project_id = "ana-finance-site"

[auth]
site_url = "https://ana-finance.github.io/site/admin/"
additional_redirect_urls = ["https://ana-finance.github.io/site/admin/", "http://localhost:5173/"]
# Pas d'inscription libre : les comptes sont créés par invitation (Edge Function admin-users).
enable_signup = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true

[functions.cms-export]
# Authentifiée par le jeton CMS_BUILD_TOKEN (GitHub Actions), pas par un JWT utilisateur.
verify_jwt = false

[functions.publish]
verify_jwt = true

[functions.analytics]
verify_jwt = true

[functions.admin-users]
verify_jwt = true
